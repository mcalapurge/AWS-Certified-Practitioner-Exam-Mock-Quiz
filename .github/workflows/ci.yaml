name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build runs the parsers, which read the content submodules.
          # Without them the parsers would overwrite the committed AWS data
          # with an empty set.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Topic mapping accuracy
        run: npm run check-data

      - name: Build
        run: npm run build

      # Runs after the build so it reads the data the parsers just regenerated.
      # Writes report/question-report.{html,json} and a job-summary digest.
      - name: Question coverage report
        run: npm run report

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        timeout-minutes: 6
        run: npm run test:e2e

      # upload-artifact only skips the zip for a single file, so call its client
      # library directly and upload each screenshot and report file as its own
      # unzipped artifact, so nothing needs extracting after download.
      - name: Install artifact client
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-client"
          npm install --prefix "$RUNNER_TEMP/artifact-client" @actions/artifact@6.2.1

      - name: Upload screenshots and question report
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { basename, dirname } = await import('node:path')
            const { DefaultArtifactClient } = await import(
              `${process.env.RUNNER_TEMP}/artifact-client/node_modules/@actions/artifact/lib/artifact.js`
            )
            const client = new DefaultArtifactClient()
            const files = await glob.create('test-results/*/*.png\nreport/question-report.*')
            for await (const file of files.globGenerator()) {
              const { id } = await client.uploadArtifact(basename(file), [file], dirname(file), {
                skipArchive: true,
                retentionDays: 7,
              })
              core.info(`Uploaded ${basename(file)} as artifact ${id}`)
            }
